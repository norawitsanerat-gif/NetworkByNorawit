<!-- ============================================================================
     navbar.html — แม่แบบ Navbar ร่วมของทุกบท (top header + sidebar)
     วิธีใช้: chapter1.html / chapter2.html ฝังส่วนนี้ไว้ (บรรทัด navbar เริ่ม)
     เนื่องจากเว็บเปิดจาก file:// ได้โดยตรง (ไม่มี build step / server)
     จึงต้องคัดลอก HTML นี้ไปวางในไฟล์บทเรียน — แก้ที่นี่แล้วอัปเดตทั้งสองไฟล์ให้ตรงกัน
     ============================================================================ -->
  <!-- ================= TOP HEADER ================= -->
  <header id="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="เปิดเมนูบทเรียน" title="เมนู">
      <i data-lucide="menu"></i>
    </button>

    <div class="brand">
      <div class="cn-logo" aria-hidden="true">CN</div>
      <div class="brand-titles">
        <h1>เครือข่ายคอมพิวเตอร์และอินเทอร์เน็ต</h1>
        <p id="headerChapterLabel">พื้นฐานการสื่อสารข้อมูลและเครือข่าย · บทที่ 1</p>
      </div>
    </div>

    <div class="topbar-right">
      <button class="icon-btn" id="homeBtn" aria-label="กลับไปเมนูหลัก" title="เมนูหลัก">
        <i data-lucide="home"></i>
      </button>
      <button class="icon-btn" id="notesBtn" aria-label="เปิดบันทึกย่อ" title="บันทึกย่อ (Notes)">
        <i data-lucide="notebook-pen"></i>
      </button>

      <div class="header-progress" aria-label="ความคืบหน้า">
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="headerProgressBar">
          <div class="progress-fill" id="headerProgressFill"></div>
        </div>
        <span class="progress-count" id="headerProgressCount">1 / 25</span>
      </div>
    </div>
  </header>

  <!-- ================= SHELL ================= -->
  <div class="shell">

    <!-- ================= SIDEBAR ================= -->
    <aside id="sidebar" aria-label="เมนูบทเรียน">
      <div class="sidebar-head">
        <div class="sidebar-head-title">
          <h2 id="sidebarChapterTitle">เมนูบทที่ 1</h2>
          <p id="sidebarChapterSub">หัวข้อในสัปดาห์นี้ · 26 หัวข้อ</p>
        </div>
        <button class="icon-btn sidebar-close" id="sidebarCloseBtn" aria-label="ปิดเมนูบทเรียน" title="ปิดเมนู">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="sidebar-info">
        <i data-lucide="info"></i>
        <span>คลิกหัวข้อหรือสไลด์เพื่อข้ามไปได้เลย<br />เรียนทีละสไลด์เพื่อเก็บเนื้อหาให้ครบ</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav" aria-label="สารบัญสไลด์"></nav>
      <div class="sidebar-foot">
        <div class="sf-top"><span>ความคืบหน้า</span><b id="sidebarPct">0%</b></div>
        <div class="progress-track"><div class="progress-fill" id="sidebarProgressFill"></div></div>
        <p class="mt-2 text-3" style="font-size:12px" id="sidebarDone">ยังไม่ได้เรียนสไลด์ใดเลย — เริ่มที่ Cover ได้เลย!</p>
      </div>
    </aside>
